<title id="title">Software classifiers and behavior, from architecture to execution</title>
<desc id="desc">Class is the general structural category; component specializes class. Operation is the general executable category; function specializes operation. Both alternatives retain private state, owned children, typed ports and direct behavior. Solid arrows show ownership; dashed arrows show references.</desc>
