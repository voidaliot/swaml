<text x="776" y="453" font-size="20" font-weight="400" fill="#17324d">application → browser</text>
<text x="776" y="481" font-size="20" font-weight="400" fill="#17324d">via checkoutLink</text>
<rect x="390" y="350" width="300" height="170" rx="0" fill="#f0eef9" stroke="#17324d"/>
