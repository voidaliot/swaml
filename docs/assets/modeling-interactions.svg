<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="570" viewBox="0 0 1080 570" role="img" aria-labelledby="title desc">
<title id="title">2 · Follow the routed message flow</title>
<desc id="desc">Purchase describes the successful exchange order. Arrows below are case after dependencies, not additional software connectors or a measured execution trace.</desc>
