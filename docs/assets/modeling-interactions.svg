<text x="776" y="143" font-size="20" font-weight="400" fill="#17324d">inventory → application</text>
<text x="776" y="171" font-size="20" font-weight="400" fill="#17324d">via inventoryLink</text>
<rect x="760" y="350" width="300" height="170" rx="0" fill="#f0eef9" stroke="#17324d"/>
<text x="776" y="382" font-size="20" font-weight="700" fill="#17324d">4 · Publish acceptance</text>
<polyline points="760,396 1060,396" fill="none" stroke="#cad6df" stroke-width="2"/>
