<polyline points="390,396 690,396" fill="none" stroke="#cad6df" stroke-width="2"/>
<text x="406" y="425" font-size="20" font-weight="400" fill="#17324d">Receipts.created</text>
<text x="406" y="453" font-size="20" font-weight="400" fill="#17324d">application → mailer</text>
<text x="406" y="481" font-size="20" font-weight="400" fill="#17324d">via receiptLink</text>
<rect x="20" y="350" width="300" height="170" rx="0" fill="#f0eef9" stroke="#17324d"/>
<text x="36" y="382" font-size="20" font-weight="700" fill="#17324d">6 · Return acceptance</text>
<polyline points="20,396 320,396" fill="none" stroke="#cad6df" stroke-width="2"/>
<text x="36" y="425" font-size="20" font-weight="400" fill="#17324d">Checkout.submit reply</text>
<text x="36" y="453" font-size="20" font-weight="400" fill="#17324d">application → browser</text>
<text x="36" y="481" font-size="20" font-weight="400" fill="#17324d">via checkoutLink</text>
