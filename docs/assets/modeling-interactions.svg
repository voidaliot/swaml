<rect x="20" y="40" width="300" height="170" rx="0" fill="#f0eef9" stroke="#17324d"/>
<text x="36" y="72" font-size="20" font-weight="700" fill="#17324d">1 · Submit order</text>
<polyline points="20,86 320,86" fill="none" stroke="#cad6df" stroke-width="2"/>
<text x="36" y="115" font-size="20" font-weight="400" fill="#17324d">Checkout.submit</text>
<text x="36" y="143" font-size="20" font-weight="400" fill="#17324d">browser → application</text>
<text x="36" y="171" font-size="20" font-weight="400" fill="#17324d">via checkoutLink</text>
<rect x="390" y="40" width="300" height="170" rx="0" fill="#f0eef9" stroke="#17324d"/>
<text x="406" y="72" font-size="20" font-weight="700" fill="#17324d">2 · Reserve stock</text>
<polyline points="390,86 690,86" fill="none" stroke="#cad6df" stroke-width="2"/>
<text x="406" y="115" font-size="20" font-weight="400" fill="#17324d">Inventory.reserve</text>
<text x="406" y="143" font-size="20" font-weight="400" fill="#17324d">application → inventory</text>
<text x="406" y="171" font-size="20" font-weight="400" fill="#17324d">via inventoryLink</text>
<rect x="760" y="40" width="300" height="170" rx="0" fill="#f0eef9" stroke="#17324d"/>
<text x="776" y="72" font-size="20" font-weight="700" fill="#17324d">3 · Return reservation</text>
<polyline points="760,86 1060,86" fill="none" stroke="#cad6df" stroke-width="2"/>
