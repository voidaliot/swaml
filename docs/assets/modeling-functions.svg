<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" role="img" aria-labelledby="title desc">
<title id="title">4 · Keep behavior with its owning component</title>
<desc id="desc">Each card is a concrete component instance and lists its owned functions. A component can own private data and behavior together with child components; every function belongs to exactly one instance.</desc>
<g font-family="DejaVu Sans, sans-serif">
<rect x="0" y="0" width="1080" height="610" rx="0" fill="white" stroke="none"/>
<rect x="20" y="40" width="500" height="220" rx="0" fill="#eef5fa" stroke="#17324d"/>
<text x="36" y="72" font-size="20" font-weight="700" fill="#17324d">browser : BrowserClient</text>
<polyline points="20,86 520,86" fill="none" stroke="#cad6df" stroke-width="2"/>
<text x="36" y="115" font-size="20" font-weight="400" fill="#17324d">buy() · on start</text>
<text x="36" y="143" font-size="20" font-weight="400" fill="#17324d">overOrder() · on receive control.overOrder</text>
<text x="36" y="171" font-size="20" font-weight="400" fill="#17324d">confirmation(orderId)</text>
<text x="36" y="199" font-size="20" font-weight="400" fill="#17324d">on receive checkout.accepted</text>
<rect x="560" y="40" width="500" height="220" rx="0" fill="#eef5fa" stroke="#17324d"/>
<text x="576" y="72" font-size="20" font-weight="700" fill="#17324d">application.checkout</text>
<polyline points="560,86 1060,86" fill="none" stroke="#cad6df" stroke-width="2"/>
<text x="576" y="115" font-size="20" font-weight="400" fill="#17324d">: CheckoutService</text>
<text x="576" y="143" font-size="20" font-weight="400" fill="#17324d">submit(orderId, quantity): bool</text>
<text x="576" y="171" font-size="20" font-weight="400" fill="#17324d">on call api.submit</text>
<text x="576" y="199" font-size="20" font-weight="400" fill="#17324d">private acceptedOrders</text>
<rect x="20" y="340" width="500" height="220" rx="0" fill="#eef5fa" stroke="#17324d"/>
<text x="36" y="372" font-size="20" font-weight="700" fill="#17324d">inventory.stock</text>
<polyline points="20,386 520,386" fill="none" stroke="#cad6df" stroke-width="2"/>
<text x="36" y="415" font-size="20" font-weight="400" fill="#17324d">: StockStore</text>
<text x="36" y="443" font-size="20" font-weight="400" fill="#17324d">reserve(quantity): bool</text>
<text x="36" y="471" font-size="20" font-weight="400" fill="#17324d">on call api.reserve</text>
<text x="36" y="499" font-size="20" font-weight="400" fill="#17324d">private available</text>
<rect x="560" y="340" width="500" height="220" rx="0" fill="#eef5fa" stroke="#17324d"/>
<text x="576" y="372" font-size="20" font-weight="700" fill="#17324d">mailer : ReceiptWorker</text>
<polyline points="560,386 1060,386" fill="none" stroke="#cad6df" stroke-width="2"/>
<text x="576" y="415" font-size="20" font-weight="400" fill="#17324d">prepareReceipt(orderId)</text>
<text x="576" y="443" font-size="20" font-weight="400" fill="#17324d">on receive input.created</text>
<text x="576" y="471" font-size="20" font-weight="400" fill="#17324d">private lastOrder + sent</text>
</g>
</svg>
