<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">SWAML — Architecture, made explicit.</title>
  <desc id="desc">A flat software architecture: two client panels connect through typed ports to a setting service. SWAML 1.2.</desc>
  <rect width="1280" height="480" fill="#18272b"/>
  <g font-family="DejaVu Sans,Arial,sans-serif">
    <rect x="54" y="48" width="30" height="30" rx="4" fill="#ed7956"/>
    <path d="M61 57h16M61 63h10M61 69h16" stroke="#18272b" stroke-width="3"/>
    <text x="98" y="73" fill="#f4f1e9" font-size="28" font-weight="700">SWAML</text>
    <text x="54" y="161" fill="#ed7956" font-size="14" letter-spacing="2">SOFTWARE ARCHITECTURE MODELING LANGUAGE</text>
    <text x="50" y="226" fill="#f4f1e9" font-size="55" font-weight="700">Architecture,</text>
    <text x="50" y="292" fill="#f4f1e9" font-size="55" font-weight="700">made explicit.</text>
    <text x="54" y="341" fill="#b6c3bf" font-size="19">Compose boundaries. Connect contracts.</text>
    <text x="54" y="370" fill="#b6c3bf" font-size="19">Follow behavior through one model.</text>
    <rect x="54" y="408" width="66" height="28" rx="4" fill="#ed7956"/>
    <text x="87" y="428" text-anchor="middle" fill="#18272b" font-size="14" font-weight="700">1.2.1</text>
    <text x="135" y="428" fill="#b6c3bf" font-size="14">FLAT VIEWS · TYPED ROUTES · REUSABLE POLICIES</text>
    <rect x="665" y="84" width="557" height="316" rx="8" fill="none" stroke="#526463"/>
    <text x="685" y="112" fill="#b6c3bf" font-size="13">«root component» Cabin</text>
    <g fill="#23373a" stroke="#95aaa3" stroke-width="1.5">
      <rect x="690" y="149" width="188" height="80" rx="4"/>
      <rect x="690" y="267" width="188" height="80" rx="4"/>
      <rect x="1001" y="203" width="192" height="101" rx="4"/>
    </g>
    <g fill="#f4f1e9" font-size="17">
      <text x="708" y="179">front : Client</text>
      <text x="708" y="297">rear : Client</text>
      <text x="1018" y="235">settings : Service</text>
    </g>
    <g fill="#b6c3bf" font-size="12">
      <text x="708" y="207">setting · requires</text>
      <text x="708" y="325">setting · requires</text>
      <text x="1018" y="261">api · provides</text>
      <text x="1018" y="283">TemperatureSetting @ 1.0.0</text>
    </g>
    <g fill="none" stroke="#ed7956" stroke-width="2">
      <path d="M884 189h53v44h57"/>
      <path d="M884 307h53v-34h57"/>
      <path d="m987 229 7 4-7 4m0 32 7 4-7 4"/>
    </g>
    <g fill="#f4f1e9" stroke="#ed7956" stroke-width="2">
      <rect x="873" y="184" width="10" height="10"/>
      <rect x="873" y="302" width="10" height="10"/>
      <rect x="996" y="228" width="10" height="10"/>
      <rect x="996" y="268" width="10" height="10"/>
    </g>
    <text x="690" y="380" fill="#b6c3bf" font-size="12">Two routes. One named policy. Independent queues.</text>
  </g>
</svg>
