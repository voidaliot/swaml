<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">Model Browser · ownership and occurrence context</title><desc id="desc">Settings example: declarations and usages have distinct badges.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#17324d"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif">
<rect x="0" y="0" width="1000" height="700" rx="8" fill="#ffffff" stroke="none"/>
<text x="32" y="47" font-size="30" font-weight="700" fill="#17324d">Model Browser · ownership and occurrence context</text>
<text x="32" y="80" font-size="17" font-weight="400" fill="#516579">Settings example: declarations and usages have distinct badges.</text>
<polyline points="32,99 968,99" fill="none" stroke="#ccd9e2" stroke-width="2"/>
<rect x="32" y="123" width="560" height="532" rx="8" fill="#f7fafc" stroke="#17324d"/>
<rect x="615" y="123" width="352" height="532" rx="8" fill="white" stroke="#17324d"/>
<text x="52" y="156" font-size="18" font-weight="700" fill="#17324d">  Settings  [package]</text>
<text x="74" y="192" font-size="18" font-weight="400" fill="#17324d">▸ TemperatureSetting  [interface]</text>
<text x="74" y="228" font-size="18" font-weight="400" fill="#17324d">  SettingStore  [unit def]</text>
<text x="96" y="264" font-size="18" font-weight="400" fill="#17324d">  api  [port: provides]</text>
<text x="96" y="300" font-size="18" font-weight="400" fill="#17324d">  currentValue  [var: Int]</text>
<text x="96" y="336" font-size="18" font-weight="400" fill="#17324d">▸ read / update  [operations]</text>
<text x="74" y="372" font-size="18" font-weight="700" fill="#17324d">  Cabin  [component root]</text>
<text x="96" y="408" font-size="18" font-weight="400" fill="#17324d">  settings : Service  [occurrence]</text>
<text x="118" y="444" font-size="18" font-weight="400" fill="#17324d">  store : SettingStore  [occurrence]</text>
<text x="140" y="480" font-size="18" font-weight="400" fill="#17324d">  api  [port: provides]</text>
<rect x="40" y="492" width="544" height="33" rx="3" fill="#d5edf0" stroke="none"/>
<text x="140" y="516" font-size="18" font-weight="700" fill="#17324d">  update  [operation occurrence]</text>
<text x="96" y="552" font-size="18" font-weight="400" fill="#17324d">▸ front : Client  [occurrence]</text>
<text x="96" y="588" font-size="18" font-weight="400" fill="#17324d">▸ rear : Client  [occurrence]</text>
<text x="637" y="158" font-size="22" font-weight="700" fill="#17324d">Selected operation</text>
<text x="637" y="202" font-size="17" font-weight="400" fill="#17324d">Instance context:</text>
<text x="637" y="232" font-size="17" font-weight="400" fill="#087f8c">Cabin.settings.store.update</text>
<text x="637" y="262" font-size="17" font-weight="400" fill="#17324d"></text>
<text x="637" y="292" font-size="17" font-weight="400" fill="#17324d">Shared declaration:</text>
<text x="637" y="322" font-size="17" font-weight="400" fill="#087f8c">SettingStore.update</text>
<text x="637" y="352" font-size="17" font-weight="400" fill="#17324d"></text>
<text x="637" y="382" font-size="17" font-weight="400" fill="#17324d">Trigger: on call api.setPoint</text>
<text x="637" y="412" font-size="17" font-weight="400" fill="#17324d">Parameters: desired: Int</text>
<text x="637" y="442" font-size="17" font-weight="400" fill="#17324d">Result: Bool</text>
<text x="637" y="472" font-size="17" font-weight="400" fill="#17324d"></text>
<text x="637" y="502" font-size="17" font-weight="400" fill="#17324d">Open declaration → GV</text>
<text x="637" y="532" font-size="17" font-weight="400" fill="#17324d">Open behavior → FV</text>
<text x="637" y="562" font-size="17" font-weight="400" fill="#17324d">Up → store occurrence</text>
</g></svg>
