<polyline points="169,229 499,229" fill="none" stroke="#17324d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="179" y="213" font-size="16" font-weight="400" fill="#17324d">adjust: setting.setPoint → api.setPoint</text>
<text x="188" y="252" font-size="16" font-weight="400" fill="#087f8c">request via frontLink · correlation adjust</text>
