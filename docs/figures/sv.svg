<polyline points="859,325 859,585" fill="none" stroke="#17324d" stroke-width="2" stroke-dasharray="7 5"/>
<polyline points="500,369 175,369" fill="none" stroke="#17324d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="41" y="351" font-size="16" font-weight="400" fill="#17324d">frontNotice: api.changed → setting.changed</text>
<text x="43" y="392" font-size="16" font-weight="400" fill="#087f8c">publish via frontLink · after adjust</text>
