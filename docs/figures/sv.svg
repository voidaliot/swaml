<text x="536" y="414" font-size="15" font-weight="400" fill="#17324d">rearNotice: api.changed → setting.changed</text>
<text x="536" y="463" font-size="16" font-weight="400" fill="#087f8c">publish via rearLink · after adjust</text>
<polyline points="499,573 175,573" fill="none" stroke="#17324d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="50" y="554" font-size="16" font-weight="400" fill="#17324d">accepted: api.setPoint → setting.setPoint</text>
<text x="52" y="601" font-size="16" font-weight="400" fill="#087f8c">reply via frontLink · after frontNotice · correlation adjust</text>
<text x="36" y="662" font-size="18" font-weight="400" fill="#516579">The rearNotice row is positioned for readability: it may occur before or after accepted.</text>
<text x="36" y="694" font-size="18" font-weight="700" fill="#17324d">Causal chains: adjust → frontNotice → accepted; adjust → rearNotice.</text>
