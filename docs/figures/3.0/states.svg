<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img"><title>swa.ml 3.0 original notation</title>
<rect x="1" y="1" width="918" height="388" fill="#fafafa" stroke="#171717"/>
<text x="26" y="36" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#171717">Operation-owned ordered states</text>
<line x1="26" y1="54" x2="894" y2="54" stroke="#171717"/>
<ellipse cx="40.0" cy="205.0" rx="5.0" ry="5.0" fill="#171717" stroke="#171717"/>
<rect x="75" y="135" width="200" height="140" fill="#ffffff" stroke="#171717"/>
<rect x="75" y="135" width="200" height="34" fill="#eeeeee" stroke="#171717"/>
<text x="87" y="158" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#171717">state Off</text>
<text x="87" y="193" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#171717">after 2ms exit;</text>
<rect x="345" y="135" width="230" height="140" fill="#ffffff" stroke="#171717"/>
<rect x="345" y="135" width="230" height="34" fill="#eeeeee" stroke="#171717"/>
<text x="357" y="158" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#171717">state On</text>
<text x="357" y="193" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#171717">on entry: lit = true</text>
<text x="357" y="215" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#171717">on exit: lit = false</text>
<text x="357" y="237" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#171717">after 3ms exit;</text>
<rect x="645" y="135" width="150" height="140" fill="#ffffff" stroke="#171717"/>
<rect x="645" y="135" width="150" height="34" fill="#eeeeee" stroke="#171717"/>
<text x="657" y="158" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#171717">state Done</text>
<text x="657" y="193" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#171717">nothing to look at</text>
<ellipse cx="855.0" cy="205.0" rx="14.0" ry="14.0" fill="#171717" stroke="#171717"/>
<line x1="45" y1="205" x2="75" y2="205" stroke="#171717"/>
<line x1="275" y1="205" x2="345" y2="205" stroke="#171717"/>
<line x1="575" y1="205" x2="645" y2="205" stroke="#171717"/>
<line x1="795" y1="205" x2="841" y2="205" stroke="#171717"/>
<text x="45" y="345" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#171717">States are steps of the flow: exit; goes on with the state written next; the end of the flow ends the operation.</text>
</svg>
