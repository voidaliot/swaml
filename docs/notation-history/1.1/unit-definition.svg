<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-labelledby="title desc">
<title id="title">Unit definition</title><desc id="desc">Unit definition. Draw a classifier rectangle headed «unit def» with separate private values and operation compartments.</desc>
<g font-family="DejaVu Sans, sans-serif" stroke-width="1.5">
<rect x="0" y="0" width="560" height="280" rx="0" fill="#ffffff" stroke="none"/>
<rect x="36" y="24" width="488" height="190" rx="0" fill="#ffffff" stroke="#111111"/>
<text x="54" y="54" font-size="20" font-weight="700" fill="#111111">«unit def»</text>
<text x="54" y="81" font-size="20" font-weight="700" fill="#111111">Listener</text>
