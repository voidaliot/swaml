<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-labelledby="title desc">
<title id="title">Package</title><desc id="desc">Package. Draw a tabbed rectangular namespace frame; the tab contains the package name.</desc>
<g font-family="DejaVu Sans, sans-serif" stroke-width="1.5">
<rect x="0" y="0" width="560" height="280" rx="0" fill="#ffffff" stroke="none"/>
<rect x="30" y="55" width="500" height="200" rx="0" fill="#ffffff" stroke="#111111"/>
<rect x="30" y="22" width="230" height="33" rx="0" fill="#ffffff" stroke="#111111"/>
<text x="44" y="47" font-size="20" font-weight="700" fill="#111111">Hello</text>
<text x="48" y="89" font-size="18" font-weight="400" fill="#111111">interface Greeting</text>
<text x="48" y="114" font-size="18" font-weight="400" fill="#111111">unit def Speaker</text>
<text x="48" y="139" font-size="18" font-weight="400" fill="#111111">component Demo</text>
</g></svg>
