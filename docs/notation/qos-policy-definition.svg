<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-labelledby="title desc">
<title id="title">Reusable QoS policy</title><desc id="desc">Named complete connector policy, shown as a flat declaration card. It has no port, behavior, deployment or runtime queue of its own.</desc>
<g font-family="DejaVu Sans, sans-serif" stroke-width="1.5">
<rect x="0" y="0" width="560" height="280" rx="0" fill="#ffffff" stroke="none"/>
<rect x="36" y="24" width="488" height="190" rx="0" fill="#ffffff" stroke="#111111"/>
<text x="54" y="54" font-size="20" font-weight="700" fill="#111111">«qos def» LocalLink</text>
<polyline points="36,67 524,67" fill="none" stroke="#111111" stroke-width="2"/>
<text x="54" y="95" font-size="18" font-weight="400" fill="#111111">delivery atMostOnce</text>
<text x="54" y="120" font-size="18" font-weight="400" fill="#111111">ordering fifo</text>
<text x="54" y="145" font-size="18" font-weight="400" fill="#111111">capacity 8</text>
<text x="54" y="170" font-size="18" font-weight="400" fill="#111111">overflow reject</text>
</g></svg>
