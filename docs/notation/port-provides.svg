<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-labelledby="title desc">
<title id="title">Service provider port</title><desc id="desc">Service provider port. Draw a boundary square with an outward stem and ball; label name: Interface, exact role and inspectable version. The ball identifies server/provides; the socket identifies client/requires.</desc>
