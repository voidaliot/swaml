<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-labelledby="title desc">
<title id="title">External deployment target</title><desc id="desc">An external reference identifies the deployment system without introducing a hardware or execution-node definition into SWAML.</desc>
