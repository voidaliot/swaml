<svg xmlns="http://www.w3.org/2000/svg" width="560" height="555" viewBox="0 0 560 555" role="img" aria-labelledby="title desc">
<title id="title">Interruptible flow region</title><desc id="desc">Interruptible flow region. A named protected region has a normal exit and one routed typed input that cooperatively transfers control to its handler.</desc>
<g font-family="DejaVu Sans, sans-serif" stroke-width="1.5">
<rect x="0" y="0" width="560" height="555" rx="0" fill="#ffffff" stroke="none"/>
<rect x="36" y="24" width="488" height="271" rx="0" fill="#ffffff" stroke="#111111"/>
<text x="54" y="58" font-size="20" font-weight="700" fill="#111111">interruptible work</text>
<circle cx="73" cy="151" r="8" fill="#111111" stroke="#111111"/>
<polyline points="82,151 111,151" fill="none" stroke="#111111" stroke-width="2"/>
<polygon points="111,151 99.0,156.0 99.0,146.0" fill="#111111" stroke="#111111"/>
<rect x="114" y="105" width="315" height="92" rx="12" fill="#ffffff" stroke="#111111"/>
<text x="175.0" y="157.0" font-size="18" font-weight="400" fill="#111111">protected statements</text>
<polyline points="272,198 272,310 155,310 155,470" fill="none" stroke="#111111" stroke-width="2"/>
<polygon points="155,470 150.0,458.0 160.0,458.0" fill="#111111" stroke="#111111"/>
<text x="175" y="345" font-size="18" font-weight="400" fill="#111111">normal exit</text>
<polyline points="430,151 494,151 494,327 407,327 407,358" fill="none" stroke="#111111" stroke-width="2"/>
<polygon points="407,358 402.0,346.0 412.0,346.0" fill="#111111" stroke="#111111"/>
<text x="337.5" y="222" font-size="18" font-weight="700" fill="#111111">on receive</text>
<text x="337.0" y="249" font-size="18" font-weight="400" fill="#111111">control.stop</text>
<text x="329.0" y="276" font-size="18" font-weight="400" fill="#111111">reason: string</text>
<rect x="287" y="361" width="242" height="78" rx="12" fill="#ffffff" stroke="#111111"/>
<text x="299.0" y="406.0" font-size="18" font-weight="400" fill="#111111">same-activation handler</text>
<text x="300" y="345" font-size="18" font-weight="400" fill="#111111">interrupt</text>
<polyline points="407,440 407,470 220,470" fill="none" stroke="#111111" stroke-width="2"/>
<polygon points="220,470 232.0,465.0 232.0,475.0" fill="#111111" stroke="#111111"/>
<polyline points="155,470 190,470" fill="none" stroke="#111111" stroke-width="2"/>
<polygon points="190,470 178.0,475.0 178.0,465.0" fill="#111111" stroke="#111111"/>
<circle cx="205" cy="470" r="10" fill="#ffffff" stroke="#111111"/>
<polyline points="205,481 205,512" fill="none" stroke="#111111" stroke-width="2"/>
<polygon points="205,512 200.0,500.0 210.0,500.0" fill="#111111" stroke="#111111"/>
<text x="226" y="505" font-size="18" font-weight="400" fill="#111111">continue after region</text>
<text x="115.0" y="544" font-size="18" font-weight="400" fill="#111111">cooperative cancellation; no rollback</text>
</g></svg>
