<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-labelledby="title desc">
<title id="title">Pure calculation</title><desc id="desc">A calculation maps named inputs to one named, typed output expression without mutable state or communication.</desc>
<g font-family="DejaVu Sans, sans-serif" stroke-width="1.5">
<rect x="0" y="0" width="560" height="280" rx="0" fill="#ffffff" stroke="none"/>
<rect x="36" y="24" width="488" height="232" rx="0" fill="#ffffff" stroke="#111111"/>
<text x="54" y="58" font-size="20" font-weight="700" fill="#111111">«calc» twice</text>
<polyline points="36,84 524,84" fill="none" stroke="#111111" stroke-width="2"/>
<text x="54" y="118" font-size="18" font-weight="400" fill="#111111">in x: real</text>
<polyline points="36,139 524,139" fill="none" stroke="#111111" stroke-width="2"/>
<text x="54" y="175" font-size="18" font-weight="400" fill="#111111">return result: real</text>
<text x="54" y="200" font-size="18" font-weight="400" fill="#111111">= x * 2.0</text>
</g></svg>
