<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" role="img" aria-labelledby="title desc">
<title id="title">State transition</title><desc id="desc">State transition. Draw a directed edge between states in the same operation; label its identity, stimulus, optional guard/priority and effect.</desc>
<g font-family="DejaVu Sans, sans-serif" stroke-width="1.5">
<rect x="0" y="0" width="560" height="320" rx="0" fill="#ffffff" stroke="none"/>
<rect x="18" y="209" width="190" height="82" rx="12" fill="#ffffff" stroke="#111111"/>
<text x="97.0" y="256.0" font-size="18" font-weight="400" fill="#111111">Idle</text>
<rect x="352" y="209" width="190" height="82" rx="12" fill="#ffffff" stroke="#111111"/>
<text x="419.0" y="256.0" font-size="18" font-weight="400" fill="#111111">Active</text>
<polyline points="208,250 352,250" fill="none" stroke="#111111" stroke-width="2"/>
<polygon points="352,250 340.0,255.0 340.0,245.0" fill="#111111" stroke="#111111"/>
<text x="25" y="34" font-size="20" font-weight="700" fill="#111111">begin</text>
<text x="143.5" y="94" font-size="18" font-weight="400" fill="#111111">begin: signal.pulse [value &gt; 0]</text>
<text x="25" y="120" font-size="18" font-weight="400" fill="#111111">on receive signal.pulse</text>
<text x="25" y="145" font-size="18" font-weight="400" fill="#111111">when (value &gt; 0); priority 1</text>
<text x="25" y="170" font-size="18" font-weight="400" fill="#111111">effect: count = value</text>
</g></svg>
