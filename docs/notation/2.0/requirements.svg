<text x="57" y="168" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#171717">immutable typed attributes</text>
<text x="57" y="190" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#171717">one formal doc</text>
