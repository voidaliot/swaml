<text x="662" y="198" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#171717">copied result / out</text>
<text x="662" y="220" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#171717">copy-back on success</text>
<line x1="275" y1="205" x2="345" y2="205" stroke="#171717"/>
<line x1="580" y1="205" x2="650" y2="205" stroke="#171717"/>
