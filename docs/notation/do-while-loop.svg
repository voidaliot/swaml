<svg xmlns="http://www.w3.org/2000/svg" width="560" height="450" viewBox="0 0 560 450" role="img" aria-labelledby="title desc">
<title id="title">Post-test do-while loop</title><desc id="desc">Post-test do-while loop. Execute the body at least once, then test the condition before requesting another bounded iteration.</desc>
<g font-family="DejaVu Sans, sans-serif" stroke-width="1.5">
<rect x="0" y="0" width="560" height="450" rx="0" fill="#ffffff" stroke="none"/>
<rect x="35" y="22" width="490" height="348" rx="14" fill="#ffffff" stroke="#111111"/>
<text x="53" y="55" font-size="20" font-weight="700" fill="#111111">do ... while</text>
<rect x="118" y="82" width="324" height="69" rx="12" fill="#ffffff" stroke="#111111"/>
<text x="149.531" y="122.5" font-size="18" font-weight="400" fill="#111111">postTested = postTested + 1</text>
<polyline points="280,152 280,214" fill="none" stroke="#111111" stroke-width="2"/>
<polygon points="280,214 275.0,202.0 285.0,202.0" fill="#111111" stroke="#111111"/>
<text x="55" y="183" font-size="18" font-weight="400" fill="#111111">first body is</text>
<text x="55" y="208" font-size="18" font-weight="400" fill="#111111">mandatory</text>
<polygon points="280,217 405,270 280,323 155,270" fill="#ffffff" stroke="#111111"/>
<text x="212.016" y="276" font-size="18" font-weight="400" fill="#111111">postTested &lt; 2</text>
<polyline points="406,270 491,270 491,116 443,116" fill="none" stroke="#111111" stroke-width="2"/>
<polygon points="443,116 455.0,111.0 455.0,121.0" fill="#111111" stroke="#111111"/>
<text x="443" y="296" font-size="18" font-weight="400" fill="#111111">true</text>
<polyline points="280,324 280,394" fill="none" stroke="#111111" stroke-width="2"/>
<polygon points="280,394 275.0,382.0 285.0,382.0" fill="#111111" stroke="#111111"/>
<text x="296" y="354" font-size="18" font-weight="400" fill="#111111">false</text>
<text x="84.5" y="416" font-size="18" font-weight="400" fill="#111111">bound 2; LoopBound before an excess body</text>
</g></svg>
