<polyline points="320,394 320,402" fill="none" stroke="#111111" stroke-width="2"/>
<text x="314.5" y="428" font-size="18" font-weight="400" fill="#111111">4</text>
<polyline points="420,394 420,402" fill="none" stroke="#111111" stroke-width="2"/>
<text x="414.5" y="428" font-size="18" font-weight="400" fill="#111111">6</text>
<polyline points="520,394 520,402" fill="none" stroke="#111111" stroke-width="2"/>
