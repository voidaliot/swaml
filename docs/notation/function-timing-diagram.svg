<rect x="170" y="322" width="150" height="30" rx="0" fill="#ffffff" stroke="#111111"/>
<text x="219.5" y="343" font-size="18" font-weight="400" fill="#111111">ready</text>
<rect x="320" y="322" width="200" height="30" rx="0" fill="#ffffff" stroke="#111111"/>
<text x="364.5" y="343" font-size="18" font-weight="400" fill="#111111">request wait</text>
