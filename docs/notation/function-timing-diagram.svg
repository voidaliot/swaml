<text x="54" y="88" font-size="18" font-weight="400" fill="#111111">declared: wcet 1 ms; deadline 30 ms; serial</text>
<text x="35" y="165" font-size="18" font-weight="400" fill="#111111">observed: reference logical time, zero CPU cost</text>
<text x="43" y="244" font-size="18" font-weight="700" fill="#111111">a1</text>
