<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" role="img" aria-labelledby="title desc">
<title id="title">Function timing diagram</title><desc id="desc">Function timing diagram. An fv projection compares observed activation releases, waits and terminal markers with separately labeled declared timing contracts.</desc>
