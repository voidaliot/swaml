<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 560 280" role="img" aria-labelledby="title desc">
<title id="title">Fixed array type and value</title><desc id="desc">Fixed array type and value. Display fixed extent in the type label T[n] and ordered elements in brackets within the owning expression.</desc>
<g font-family="DejaVu Sans, sans-serif" stroke-width="1.5">
<rect x="0" y="0" width="560" height="280" rx="0" fill="#ffffff" stroke="none"/>
<rect x="36" y="24" width="488" height="190" rx="0" fill="#ffffff" stroke="#111111"/>
<text x="54" y="54" font-size="20" font-weight="700" fill="#111111">samples: Real[3]</text>
<polyline points="36,67 524,67" fill="none" stroke="#111111" stroke-width="2"/>
<text x="54" y="95" font-size="18" font-weight="400" fill="#111111">[1.0, 2.0, 3.0]</text>
<text x="54" y="120" font-size="18" font-weight="400" fill="#111111">samples[i]</text>
</g></svg>
