<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="swa.ml is a textual modeling language for software architects. Define component boundaries, typed communication and executable behavior; validate models and inspect reference execution traces." />
    <title>swa.ml — Executable software architecture</title>
    <link rel="icon" type="image/svg+xml" href="./swaml.svg" />
    <script>try{var t=localStorage.getItem('swaml-theme');document.documentElement.dataset.theme=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.querySelector('link[rel="icon"]').href=document.documentElement.dataset.theme==='dark'?'./swaml-white.svg':'./swaml.svg'}catch{}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
