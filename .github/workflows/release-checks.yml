name: Publication and compatibility

# Deliberate publication acceptance only. PR development uses local checks and
# the single reviewed-readiness Language checks confirmation job.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

  notation-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/check-notation.mjs

  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ci-pdf-requirements.txt
      - run: python -m pip install -r scripts/ci-pdf-requirements.txt
      - name: Check generated figures and notation
        run: |
          python scripts/build-graphical-examples.py --check
          python scripts/build-modeling-overview.py --check
          python scripts/build-notation.py --check
      - name: Check current and historical publication integrity
        run: |
          python scripts/test-publication-archive.py
          python scripts/test-publication-2-0.py
          python scripts/check-spec-pdf.py
          python scripts/check-spec-pdf-2.0.py --archive
          python scripts/test-publication-2-1.py
      - name: Check the current 2.2 publication against exact source
        run: |
          python scripts/test-publication-2-2.py
          python scripts/check-spec-pdf-2.2.py
      # Published 2.1 bytes are checked only against their own embedded sources.
      - name: Check the published 2.1 edition
        run: python scripts/check-spec-pdf-2.1.py --archive
