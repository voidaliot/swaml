name: Language checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/pdf-requirements.txt
      - run: python -m pip install -r scripts/pdf-requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Verify committed publication
        run: python scripts/check-spec-pdf.py
      - name: Rebuild from source and verify
        run: |
          python scripts/build-spec-pdf.py --output tmp/pdfs/rebuilt.pdf
          python scripts/check-spec-pdf.py --pdf tmp/pdfs/rebuilt.pdf
