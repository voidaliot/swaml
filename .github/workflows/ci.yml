name: Language checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node --test test/ci/*.test.mjs

  notation-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify notation with native Windows paths
        run: node scripts/check-notation.mjs

  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ci-pdf-requirements.txt
      - run: python -m pip install -r scripts/ci-pdf-requirements.txt
      - name: Verify generated vector examples
        run: python scripts/build-graphical-examples.py --check
      - name: Verify graphical modeling overview
        run: python scripts/build-modeling-overview.py --check
      - name: Verify canonical SVG and PNG notation
        run: python scripts/build-notation.py --check
      - name: Verify committed publication
        run: |
          python scripts/test-publication-archive.py
          python scripts/check-spec-pdf.py
          python scripts/check-spec-pdf-2.0.py
