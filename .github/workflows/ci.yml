name: Language checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            showcase/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node --test test/ci/*.test.mjs

      # Reuse the built language core instead of building it in a second PR job.
      - run: npm ci --ignore-scripts
        working-directory: showcase
      - run: npm run build
        working-directory: showcase
      - run: node scripts/check-site-artifact.mjs
