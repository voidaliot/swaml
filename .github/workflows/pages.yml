name: Showcase · GitHub Pages

on:
  pull_request:
    paths: ['showcase/**', 'examples/**', 'docs/QUICK_START.md', 'docs/MODELING_OVERVIEW.md', 'spec/modeling-overview.json', 'src/language/**', 'scripts/check-showcase.mjs', 'scripts/check-modeling-overview.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            showcase/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/check-showcase.mjs
      - run: node scripts/check-modeling-overview.mjs
      - run: npm ci
        working-directory: showcase
      - run: npm run build
        working-directory: showcase
      - uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
