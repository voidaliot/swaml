name: Showcase · GitHub Pages

on:
  pull_request:
    paths: ['showcase/**', 'examples/**', 'docs/**', 'spec/**', 'libraries/**', 'skills/**', 'src/**', 'scripts/**', 'package*.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            showcase/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/check-showcase.mjs
      - run: node scripts/check-modeling-overview.mjs
      - run: node scripts/build-traceability-demo.mjs --check
      - run: node scripts/build-timing-demo.mjs --check
      - run: npm ci --ignore-scripts
        working-directory: showcase
      - run: npm run build
        working-directory: showcase
      - name: Check the public artifact boundary
        run: node scripts/check-site-artifact.mjs
      - name: Archive only the checked production site
        if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: tar --directory showcase/dist -cf "$RUNNER_TEMP/artifact.tar" .
      # The composite upload-pages action internally uses a mutable action tag.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
